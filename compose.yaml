name: hsl

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: hsl
      POSTGRES_DB: hsl
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    # Postgres 18 moved PGDATA. Mounting /var/lib/postgresql/data on this image
    # gives an empty database on every restart.
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hsl -d hsl"]
      interval: 10s
      timeout: 5s
      retries: 5
      # pg_isready answers before first-time initialisation finishes.
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://hsl@db:5432/hsl
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      DOOR_TOKEN_FILE: /run/secrets/door_token
      PUBLIC_ORIGIN: ${HSL_SCHEME:?set HSL_SCHEME to http or https}://${HSL_DOMAIN:?set HSL_DOMAIN}
    secrets:
      - db_password
      - auth_secret
      - door_token
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      HSL_DOMAIN: ${HSL_DOMAIN:?set HSL_DOMAIN}
      HSL_SCHEME: ${HSL_SCHEME:?set HSL_SCHEME to http or https}
      HSL_ACME_EMAIL: ${HSL_ACME_EMAIL:-}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  db_data:
  caddy_data:
  caddy_config:

secrets:
  db_password:
    file: ./secrets/db_password
  auth_secret:
    file: ./secrets/auth_secret
  door_token:
    file: ./secrets/door_token
