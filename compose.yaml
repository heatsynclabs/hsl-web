name: hsl

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: hsl
      POSTGRES_DB: hsl
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    # Postgres 18 moved PGDATA. Mounting /var/lib/postgresql/data on this image
    # gives an empty database on every restart.
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hsl -d hsl']
      interval: 10s
      timeout: 5s
      retries: 5
      # pg_isready answers before first-time initialisation finishes.
      start_period: 30s

  # Applies the schema and exits. The API waits for it to finish, so two API
  # containers can never race to migrate and a failed migration stops the deploy
  # rather than leaving a service running against a half migrated database.
  migrate:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ['node', 'dist/migrate.js']
    environment:
      DATABASE_URL: postgres://hsl@db:5432/hsl
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      PUBLIC_ORIGIN: ${HSL_PUBLIC_ORIGIN:?set HSL_PUBLIC_ORIGIN, the URL a browser types}
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      DOOR_TOKEN_FILE: /run/secrets/door_token
      SMTP_URL_FILE: /run/secrets/smtp_url
    secrets: [db_password, auth_secret, door_token, smtp_url]
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://hsl@db:5432/hsl
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      DOOR_TOKEN_FILE: /run/secrets/door_token
      SMTP_URL_FILE: /run/secrets/smtp_url
      MAIL_FROM: ${HSL_MAIL_FROM:-HeatSync Labs <noreply@heatsynclabs.org>}
      PUBLIC_ORIGIN: ${HSL_PUBLIC_ORIGIN:?set HSL_PUBLIC_ORIGIN, the URL a browser types}
    secrets: [db_password, auth_secret, door_token, smtp_url]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/Dockerfile
    restart: unless-stopped
    ports:
      - '${HSL_HTTP_PORT:-80}:80'
      # Only reachable when HSL_SCHEME is https. Locally these stay on high
      # ports so nothing needs root and nothing collides with another stack.
      - '${HSL_HTTPS_PORT:-443}:443'
      - '${HSL_HTTPS_PORT:-443}:443/udp'
    environment:
      HSL_DOMAIN: ${HSL_DOMAIN:?set HSL_DOMAIN}
      HSL_SCHEME: ${HSL_SCHEME:?set HSL_SCHEME to http or https}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # Catches every message the API sends, so password reset can be followed
  # without a real mail server. Read them at http://localhost:8025.
  mail:
    image: axllent/mailpit:v1.28
    restart: unless-stopped
    ports:
      - '127.0.0.1:${HSL_MAIL_PORT:-8025}:8025'

volumes:
  db_data:
  caddy_data:
  caddy_config:

secrets:
  db_password:
    file: ./secrets/db_password
  auth_secret:
    file: ./secrets/auth_secret
  door_token:
    file: ./secrets/door_token
  # Password reset is the only way in for a member with no password. See
  # services/api/src/mailer.ts. The API refuses to start on https without it.
  smtp_url:
    file: ./secrets/smtp_url
