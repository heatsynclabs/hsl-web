# Adds a copy of the old Rails members database, so the import can be run and
# the stack can be looked at with real shaped data.
#
# Put a pg_dump custom format file at ./legacy/members.dump first. It is restored
# into a container that is never reachable from outside this machine, and it is
# opened read only by the import.
#
#   docker compose -f compose.yaml -f compose.legacy.yaml up -d legacy-db
#   docker compose -f compose.yaml -f compose.legacy.yaml run --rm import --dry-run
#
# ./legacy/ is gitignored. Never commit a dump.

services:
  legacy-db:
    # Production runs Postgres 8.4. 9.6 is the oldest image that still exists
    # and it restores an 8.4 dump without complaint.
    image: postgres:9.6
    # Deliberately not unless-stopped. This holds a full copy of the pre-cutover
    # members database, so it should not quietly come back after a host reboot
    # and sit there for a year. The runbook says when to remove it.
    restart: 'no'
    environment:
      POSTGRES_USER: legacy
      POSTGRES_PASSWORD: legacy
      POSTGRES_DB: members
    volumes:
      - legacy_data:/var/lib/postgresql/data
      - ./legacy:/dumps:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U legacy -d members']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  import:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: tools
    environment:
      LEGACY_DATABASE_URL: postgres://legacy:legacy@legacy-db:5432/members
      DATABASE_URL: postgres://hsl@db:5432/hsl
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    depends_on:
      db:
        condition: service_healthy
      legacy-db:
        condition: service_healthy
    profiles: ['tools']
    restart: 'no'

volumes:
  legacy_data:
