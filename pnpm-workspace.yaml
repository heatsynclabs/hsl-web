packages:
  - packages/*
  - services/*
  - apps/*

# One version per shared dependency, declared once. Packages write "catalog:".
# See docs/decisions/0002-the-stack.md for why each version is pinned here.
catalog:
  vue: 3.5.42
  vue-router: 5.3.0
  vite: 8.2.2
  '@vitejs/plugin-vue': 6.0.8
  typescript: 6.0.3
  vue-tsc: 3.3.11
  '@vue/tsconfig': 0.9.1
  vitest: 4.1.11
  '@vue/test-utils': 2.5.0
  jsdom: 30.0.1
  zod: 4.5.4
  hono: 4.13.5
  '@hono/node-server': 2.1.1
  '@hono/zod-validator': 0.9.1
  'better-auth': 1.7.2
  'drizzle-orm': 0.45.2
  'drizzle-kit': 0.31.10
  pg: 8.23.0
  '@types/pg': 8.15.6
  bcryptjs: 3.0.2
  nodemailer: 9.1.1
  '@types/nodemailer': 8.0.1
  '@types/node': 22.20.1
  esbuild: 0.28.2
  eslint: 10.9.1
  'eslint-plugin-vue': 10.10.0
  'typescript-eslint': 8.69.0
  'eslint-plugin-boundaries': 7.2.0

# Vite and Vitest need esbuild's postinstall to fetch its native binary.
onlyBuiltDependencies:
  - esbuild


# drizzle-kit pulls the deprecated @esbuild-kit packages, which pin esbuild
# 0.18.20. GHSA-67mh-4wv8-2f99 lets any website reach esbuild's development
# server. Nothing here starts that server, so the path is not reachable, but it
# is a build tool that ends up in an image and the override costs nothing.
# Remove this when drizzle-kit drops @esbuild-kit, which it does on the 1.0 line.
overrides:
  esbuild: '>=0.25.0'
