# Development, where the apps run from Vite on the host with hot reload and only
# the database, the API and the mail catcher run in Docker.
#
#   docker compose up -d db api mail
#   pnpm dev
#
# For the whole stack in Docker instead, including the built apps behind Caddy,
# use compose.yaml on its own. See README.md.

services:
  db:
    ports:
      - '127.0.0.1:5432:5432'

  api:
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      NODE_ENV: development

  web:
    profiles: ['proxy']
