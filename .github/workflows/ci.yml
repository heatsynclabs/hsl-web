name: ci

on:
  push: { branches: [main, rev3] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: hsl
          POSTGRES_USER: hsl
          POSTGRES_PASSWORD: hsl
        options: >-
          --health-cmd "pg_isready -U hsl" --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]

    env:
      DATABASE_URL: postgres://hsl:hsl@localhost:5432/hsl

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }

      - run: npm ci && npm --prefix api ci && npm --prefix door ci

      - name: The schema, built from nothing
        run: node scripts/migrate.ts

      - run: make typecheck

      - run: make voice

      - run: make test

      - name: No language model is named as an author
        if: github.event_name == 'pull_request'
        run: |
          git log --format='%B' ${{ github.event.pull_request.base.sha }}..HEAD > /tmp/messages
          ! grep -inE 'co-authored-by:[[:space:]]*(claude|gpt|copilot|gemini)|generated with \[?claude|claude-session:' /tmp/messages
