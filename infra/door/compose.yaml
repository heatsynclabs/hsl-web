# Runs on the lab host, on the LAN with the door controller. Nothing else.
# This machine holds the controller password and opens no inbound port.
name: hsl-door

services:
  door:
    # The same bound as the public host. An unrotated log on the lab machine
    # fills a disk and takes the door service with it.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    build:
      context: ../..
      dockerfile: services/door/Dockerfile
    restart: unless-stopped
    environment:
      CONTROLLER_URL: ${CONTROLLER_URL:?set CONTROLLER_URL, for example http://192.168.1.177}
      CONTROLLER_PASSWORD_FILE: /run/secrets/controller_password
      API_URL: ${API_URL:?set API_URL, the public members API}
      DOOR_TOKEN_FILE: /run/secrets/door_token
      # A container's own loopback is not reachable from the host, so binding
      # 127.0.0.1 inside it makes the publish below answer nothing. The publish
      # is what restricts this to the lab host.
      HOST: 0.0.0.0
    secrets:
      - controller_password
      - door_token
    # Bound to loopback. The API is reached outbound; nothing reaches in.
    ports:
      - "127.0.0.1:8080:8080"
    # /healthz says nothing about the building and needs no credential, which is
    # what makes it usable here. It answers while the process is up; it does not
    # mean the controller is answering.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  controller_password:
    file: ./secrets/controller_password
  door_token:
    file: ./secrets/door_token
