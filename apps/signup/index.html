<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Join HeatSync Labs</title>
  </head>
  <body>
    <script>
      // Applies the stored theme before the first paint, so a member who chose
      // dark does not get a white flash while Vue boots. The key matches
      // THEME_STORAGE_KEY in @hsl/ui.
      try {
        var t = localStorage.getItem('hsl.theme')
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
