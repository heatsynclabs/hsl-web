# The public host. Three containers, one volume that matters.
#
# Base images are pinned by digest, read on 2026-09-12, so a redeploy brings up
# the image that was tested rather than whatever the tag moved to. Moving one is
# editing the digest here, which is the point.
#
# Every container has a memory and PID limit: one runaway process should not
# take the host down and the door status with it.

services:
  db:
    image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    restart: unless-stopped
    environment:
      POSTGRES_DB: hsl
      POSTGRES_USER: hsl
      POSTGRES_PASSWORD: ${PG_PASS:?set PG_PASS in .env, or run make secrets}
    volumes: [db:/var/lib/postgresql/data]
    # The loopback, not every interface. This is the members database: every
    # password hash, every door event and the audit log. It is published at all
    # only so the migration and import scripts can reach it from the host.
    ports: ["127.0.0.1:${PG_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hsl"]
      interval: 10s
    deploy:
      resources:
        limits: { memory: 1g, pids: 200 }
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: ghcr.io/heatsynclabs/hsl-web-api:latest
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://hsl:${PG_PASS}@db:5432/hsl
      ISSUER: ${ISSUER:-http://localhost:3000}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      RESET_URL: ${RESET_URL:-}
      SIGNING_KEY: ${SIGNING_KEY:-}
      SIGNING_KEY_PUBLIC: ${SIGNING_KEY_PUBLIC:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      PEPPER: ${PEPPER:-}
      DOOR_STALE_SECONDS: 180
      DOORS: ${DOORS:-front,rear}
    # Bound to the loopback, because Caddy is what the world reaches and a port
    # published on every interface is a way past the TLS and the headers.
    ports: ["127.0.0.1:${API_PORT:-3000}:3000"]
    deploy:
      resources:
        limits: { memory: 512m, pids: 200 }
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  # Not started on a laptop: `docker compose --profile public up -d` is the
  # public host, and `make up` is everything else.
  caddy:
    image: caddy:2@sha256:13ba145cba2f3e28fa801994876e4c086d1b95d5aa2a520a734765ffb6b12017
    restart: unless-stopped
    profiles: [public]
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    environment:
      HSL_DOMAIN: ${HSL_DOMAIN:-localhost}
    deploy:
      resources:
        limits: { memory: 256m, pids: 100 }

volumes:
  db: {}
  caddy: {}
